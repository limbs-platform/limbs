<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="index.css" />
    <script src="/js/base.js" defer></script>

    <title>L.I.M.B.S. Login Page</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="/register">register</a></li>
        </ul>
      </nav>
      <h1>Welcome to L.I.M.B.S. Intranet Systems</h1>
    </header>
    <div class="content">
      <div class="sidebar">sidebar</div>
      <main>
        <form class="login-card" action="/login" method="POST">
          <h1>Please, provide your credentials</h1>

          <div class="field">
            <label for="username">User</label>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="username.hash"
              pattern="^[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+$"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="options">
            <a href="/forgot-password">Forgot password?</a>
          </div>

          <button type="submit">Log in</button>
        </form>
      </main>
      <div class="sidebar">sidebar</div>
    </div>

    <footer>
      <p>&copy; 1998-2026 Limbs Platform. All rights reserved.</p>
    </footer>
  </body>
</html>
